<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>复习打卡 · 高考数学</title>
<meta name="theme-color" content="#24405C">
<meta name="description" content="高考数学一轮复习进度打卡：89 个小节、阶段计划、网课课表与每日打卡。">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="复习打卡">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1><span class="mark">数</span>一轮复习</h1>
      <p>高考数学 · 进度打卡</p>
    </div>
    <nav class="nav">
      <button class="nav-item" data-page="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        今日
      </button>
      <button class="nav-item" data-page="book">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/><path d="M8 7h8M8 11h5"/></svg>
        章节
      </button>
      <button class="nav-item" data-page="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21"/></svg>
        计划
        <span class="badge" id="planBadge" style="display:none"></span>
      </button>
      <button class="nav-item" data-page="timetable">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17.5h6"/></svg>
        课表
      </button>
      <button class="nav-item" data-page="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        统计
      </button>
    </nav>
    <div class="side-foot">
      <div class="foot-box">
        <div class="k">距离高考还有</div>
        <div class="v"><span id="countdown">--</span><small>天</small></div>
        <div class="mini-bar"><i id="totalBar" style="width:0"></i></div>
        <div class="hint"><b id="totalPct">0%</b> · <span id="globalHint">--</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">今日</h2>
      <div class="grow"></div>
      <div class="date" id="topDate"></div>
    </header>
    <div class="page-wrap">
      <section class="page" id="page-today"></section>
      <section class="page" id="page-book"></section>
      <section class="page" id="page-plan"></section>
      <section class="page" id="page-timetable"></section>
      <section class="page" id="page-stats"></section>
    </div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
